name: Daily Crypto Content Bot

on:
  schedule:
    - cron: '30 17 * * *'  # 17:30 UTC = 23:00 IST daily
  workflow_dispatch:        # allows manual trigger from GitHub UI

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set today's date (UTC)
        run: echo "TODAY=$(date -u +%Y%m%d)" >> $GITHUB_ENV

      - name: Create output directory
        run: mkdir -p output

      # Restore any scripts already generated today (from a previous run that hit quota mid-way).
      # restore-keys finds the latest partial cache for today even if the exact key differs.
      - name: Restore daily script cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: output/scripts_${{ env.TODAY }}.json
          key: gemini-scripts-${{ env.TODAY }}-${{ github.run_id }}
          restore-keys: |
            gemini-scripts-${{ env.TODAY }}-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install system dependencies
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py --now

      # Save whatever scripts were generated (even partial) so re-runs skip already-cached scripts.
      # Uses a unique key per run; restore-keys above will pick up the latest on the next run.
      - name: Save daily script cache
        uses: actions/cache/save@v4
        if: always()
        continue-on-error: true
        with:
          path: output/scripts_${{ env.TODAY }}.json
          key: gemini-scripts-${{ env.TODAY }}-${{ github.run_id }}
